name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flutter:
    name: Analyse et tests Dart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Format
        run: dart format --set-exit-if-changed lib test

      - name: Analyse statique
        run: flutter analyze

      - name: Tests
        run: flutter test

  firestore-rules:
    name: Règles de sécurité Firestore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # L'émulateur Firestore tourne sur la JVM.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Dépendances de test
        run: npm install --no-save @firebase/rules-unit-testing firebase firebase-tools

      - name: Tests des règles
        run: >
          npx firebase emulators:exec
          --only firestore
          --project demo-dating-app
          "node test/rules/firestore_rules_test.mjs"
