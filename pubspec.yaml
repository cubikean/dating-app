name: dating_app_boilerplate
description: "Boilerplate Flutter pour une application de rencontre (style Tinder/Bumble) avec Firebase + Riverpod."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # --- Navigation ---
  go_router: ^14.2.0

  # --- State management ---
  flutter_riverpod: ^2.5.1

  # --- Firebase ---
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.4
  cloud_firestore: ^5.2.1
  firebase_storage: ^12.1.3

  # --- Auth sociale (optionnel, à activer selon besoin) ---
  google_sign_in: ^6.2.1

  # --- UI / UX ---
  flutter_card_swiper: ^7.0.1 # pile de cartes façon Tinder
  cached_network_image: ^3.4.0
  image_picker: ^1.1.2

  # --- Utilitaires ---
  intl: ^0.19.0
  equatable: ^2.0.5
  uuid: ^4.4.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  # Firestore en mémoire, pour tester les services sans émulateur ni réseau.
  fake_cloud_firestore: ^3.0.0

flutter:
  uses-material-design: true
  # assets:
  #   - assets/images/
  #   - assets/icons/
