<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="dating_app_boilerplate">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>dating_app_boilerplate</title>
  <link rel="manifest" href="manifest.json">

  <!--
    App Check en développement local.

    reCAPTCHA v3 refuse les domaines qu'il ne connaît pas, et `flutter run`
    sert l'app depuis localhost sur un port qui change à chaque lancement.
    Ce drapeau bascule App Check sur le fournisseur de débogage : au premier
    chargement, la console du navigateur imprime un jeton à enregistrer dans
    la console Firebase, sous App Check puis « Gérer les jetons de débogage ».

    Le test sur le nom d'hôte garantit que rien de tout ceci ne s'active en
    production : là, c'est bien reCAPTCHA qui atteste l'application.
    Il doit être posé avant le démarrage de Flutter, d'où sa place ici.
  -->
  <script>
    if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
      self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
    }
  </script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
